name: opentexila-prod

# Hosted demo: one server, one domain, HTTPS from Caddy (Let's Encrypt).
# Only Caddy publishes ports (80 and 443). The database and the API stay on
# the private Docker network. See docs/DEPLOYMENT.md.
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

x-api-environment: &api-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  JWT_AUTH_ENABLED: 'true'
  DEV_AUTH_ENABLED: 'false'
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
  # Two proxies sit in front of the API: Caddy and the frontend's Nginx.
  TRUST_PROXY_HOPS: '2'
  DB_HOST: db
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:-opentexila}
  DB_USER: ${DB_USER:-opentexila}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
  INSTITUTION_TIMEZONE: ${INSTITUTION_TIMEZONE:-Australia/Melbourne}
  SEED_PASSWORD: ${SEED_PASSWORD:-}
  TZ: UTC

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
      MYSQL_DATABASE: ${DB_NAME:-opentexila}
      MYSQL_USER: ${DB_USER:-opentexila}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Small-server settings (1 GB of memory): the demo has very little data.
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=30
    volumes:
      - opentexila_prod_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build:
      context: .
      target: production
    environment: *api-environment
    command:
      [
        'node',
        '--experimental-strip-types',
        '--no-warnings',
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/database/data-source.js',
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const net = require('node:net'); const s = net.connect(3000, '127.0.0.1', () => { s.end(); process.exit(0); }); s.setTimeout(2000, () => process.exit(1)); s.on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10

  # The Vue app (built) served by Nginx, which also passes /api/ to the API.
  web:
    build:
      context: ${FRONTEND_DIR:-../frontend}
      target: production
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Keep the certificates, so a restart does not ask Let's Encrypt again.
      - opentexila_prod_caddy_data:/data
      - opentexila_prod_caddy_config:/config
    depends_on:
      - web

volumes:
  opentexila_prod_mysql:
  opentexila_prod_caddy_data:
  opentexila_prod_caddy_config:
